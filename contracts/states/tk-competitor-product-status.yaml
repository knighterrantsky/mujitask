schema_version: 1
contract_type: state_contract
state_code: tk_competitor_product_status
display_name: 商品状态
field_contract: contracts/fields/feishu-tk-competitor.yaml
owner: business

empty_semantics: active_or_not_yet_classified
participates_in_pending: false

allowed_values:
  - value: 已下架/区域不可售
    category: tiktok_terminal_fastmoss_active
    written_by_system: true
    meaning: TikTok normalized result 已明确判定商品下架、不存在或区域不可售
    next_default_action: skip_tiktok_browser_and_tiktok_origin_media_but_continue_fastmoss_owned_fields_explicit_unavailable_presentation_fallback_and_influencer_sync

fastmoss_presentation_fallback_authorization:
  authorized_status: 已下架/区域不可售
  allowed_fields:
    - 图片
    - 标题
    - 节日
    - 卖家
  require_explicit_tiktok_unavailable_evidence: true
  authorized_status_is_not_sufficient_without_explicit_tiktok_evidence: true
  forbidden_when_only:
    - network_failure
    - timeout
    - http_5xx
    - http_429
    - security_control
    - login_required
    - captcha
    - generic_access_restricted
    - proxy_failure
    - extraction_failure
  fill_missing_only: true

write_rules:
  - condition: product_unavailable_or_region_blocked
    writer: competitor_table_projection_mapper
    value: 已下架/区域不可售
    overwrite_policy: system_may_write_status

reset_rules:
  - trigger: 人工修改 产品链接 或 SKU-ID
    action: 人工清空 商品状态
    effect: 允许该行重新进入 TikTok 商品侧抓取候选判断；FastMoss 补齐和达人池采集不依赖该重置
