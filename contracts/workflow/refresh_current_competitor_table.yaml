schema_version: 1
contract_type: workflow_contract
workflow_code: refresh_current_competitor_table
domain: tk_competitor
task_code: refresh_current_competitor_table
status: migrated_existing

business_requirement: docs/business/requirements/refresh-current-competitor-table.md
architecture_design: docs/arch/workflow-competitor-table-design.md
implementation_manifest: src/automation_business_scaffold/contracts/workflow/refresh_current_competitor_table.yaml
field_contracts:
  - contracts/fields/feishu-tk-competitor.yaml
state_contracts:
  - contracts/states/tk-competitor-product-status.yaml

source_adapter: competitor_table_source_adapter
projection_mappers:
  - competitor_table_projection_mapper

persistence_requirements:
  requires_fact_db: true
  requires_object_storage: true
  fact_bundle_upsert:
    require_database_persistence: true
    missing_fact_db_policy: fail_fast
    forbidden_success_modes:
      - dry_run
  media_asset_sync:
    require_object_storage: true
    missing_object_storage_policy: fail_fast
    provider_local_policy: fail_fast
    forbidden_success_modes:
      - linked_local

stages:
  - stage_code: read_competitor_rows
    handler_code: feishu_table_read
    source_adapter: competitor_table_source_adapter
    purpose: 读取 TK竞品收集 中缺少 13 个自动维护字段且未被状态跳过的候选行
  - stage_code: dispatch_row_refresh_jobs
    handler_code: executor_daemon
    purpose: 每条候选飞书记录最多创建一个 competitor_row_refresh 主 job
  - stage_code: refresh_competitor_rows
    job_code: competitor_row_refresh
    handler_code: competitor_row_refresh
    projection_mapper: competitor_table_projection_mapper
    purpose: 串行完成 TikTok request、必要 browser fallback、FastMoss、按来源门禁选择 media sync、Fact DB、飞书写回；如需 browser fallback，只返回业务化 browser request 和 browser_fallback_payload，不允许在 API worker 内联执行 browser handler
  - stage_code: browser_fallback
    job_code: tiktok_product_browser_fetch / fastmoss_security_browser_resolve
    handler_code: browser_runloop
    runtime_table: task_execution
    purpose: executor/runtime 根据唯一 waiting competitor_row_refresh 派发 task_execution，等待 browser-runloop 终态并负责 browser result 回写
  - stage_code: ready_for_summary
    handler_code: outbox_dispatch
    purpose: 汇总行级结果并写通知 outbox

protected_invariants:
  - 一条候选飞书记录最多创建一个 competitor_row_refresh 主 job
  - TikTok request、FastMoss、按来源门禁选择的 media sync、Fact DB upsert、飞书写回属于该主 job 内部步骤
  - Waiting competitor_row_refresh is the only pending row-level fallback fact, task_execution is the browser task fact; competitor_row_refresh 只能返回业务化 browser request，不允许直接 import browser capability 或 run_supervised_handler inline fallback
  - API worker 不允许以 worker_type=browser_worker 或 ChildRunnerConfig 内联执行 tiktok_product_browser_fetch / fastmoss_security_browser_resolve
  - executor/runtime 必须基于唯一 waiting row job 派发或等待 browser task_execution，并负责把受控尺寸的 browser normalized result、cookie cache metadata 或失败摘要写回原 row job
  - fallback_required is a compatibility handler signal, not a Runtime DB lifecycle status or final result_status; pending/running/waiting/finished/cancelled are lifecycle states, success/partial_success/failed/skipped are terminal result_status values
  - TikTok browser fallback may substitute the current TikTok collection stage output only through task_execution.result_json normalized_product_result; local diagnostic artifact indexes are not downstream inputs or MinIO refs. FastMoss security browser fallback only persists fastmoss_session_cookie_cache and unblocks one retry of the original FastMoss API stage
  - Browser task_execution terminal 后，executor/runtime 写回当前 competitor_row_refresh 并让同一个行级主 job 回到 pending 或收敛为终态；不得创建独立恢复 stage、派生 candidate 或第二个行级业务事实源
  - browser task_execution success is not a row-level business terminal result; ready_for_summary can only summarize final competitor_row_refresh row_status/result_status and must have no waiting row job or active browser execution
  - 正式 workflow 使用 fact_bundle_upsert / media_asset_sync 时必须声明严格持久化需求；Runtime 从项目运行配置解析真实 Fact DB 和对象存储，缺配置不能 dry-run 或 local success
  - 只有确实需要独立 browser 生命周期时，才允许派生 tiktok_product_browser_fetch / fastmoss_security_browser_resolve child task_execution
  - 商品状态不是 13 个自动维护字段，不参与 pending 判断
  - TikTok normalized result 明确判定商品下架、不存在或区域不可售时，必须允许系统写回 商品状态=已下架/区域不可售
  - 只有 TikTok normalized result 明确形成 off_shelf_or_region_unavailable 终态并写回 商品状态=已下架/区域不可售 时，competitor_row_refresh 才允许使用 FastMoss 回退当前为空的 图片、标题、节日、卖家
  - TikTok 网络失败、超时、5xx、429、风控、登录、验证码、普通访问受限、代理异常或解析失败不得触发 FastMoss 的 图片、标题、节日、卖家 回退；这些状态仍按 TikTok retry 或 browser fallback contract 收敛
  - 商品状态=已下架/区域不可售 只终止 TikTok 商品侧浏览器和 TikTok 来源媒体采集，不得终止 FastMoss 商品补齐；图片为空且 FastMoss 返回有效商品图片时，既有 media_asset_sync 可以物化 FastMoss media_ref
  - FastMoss 商品图片 media_ref 只允许取 goods.base.data.product.cover_list[0]；cover_list 缺失、为空或首项无效时不产生图片，不得读取数组后续项或 img、image、image_url、cover 等其他字段回退
  - 已标记不可售记录仅在 图片、标题、节日、卖家、Fastmoss价格、佣金率、昨日销量、近7天销量、近90天销量 任一字段缺失时进入后续定时补齐；价格等不可由 FastMoss 回退的 TikTok 字段不触发不可售行重采
  - FastMoss 商品展示字段回退必须 fill_missing_only；不得覆盖飞书已有值，Fastmoss价格 不得回填 价格，FastMoss 原始远程图片 URL 不得直接作为飞书图片或 Fact DB 媒体事实写入

known_architecture_gaps: []
