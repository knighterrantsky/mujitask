schema_version: 1
roadmap_status: stable

owners:
  business_flow:
    paths:
      - src/automation_business_scaffold/domains/**/flows/**
    allowed_helper_like_paths:
      - path: src/automation_business_scaffold/domains/tiktok/flows/search_keyword_competitor_products/orchestrator.py
        reason: Required workflow package entrypoint for stage dispatch and public import compatibility; stage logic remains in stages/.
      - path: src/automation_business_scaffold/domains/tiktok/flows/refresh_current_competitor_table/orchestrator.py
        reason: Required workflow package entrypoint for stage dispatch and public import compatibility; stage logic remains in stages/.
      - path: src/automation_business_scaffold/domains/tiktok/flows/sync_tk_influencer_pool/orchestrator.py
        reason: Required workflow package entrypoint for stage dispatch and public import compatibility; stage logic remains in stages/.
      - path: src/automation_business_scaffold/domains/tiktok/flows/tiktok_fastmoss_product_ingest/orchestrator.py
        reason: Required workflow package entrypoint for stage dispatch and public import compatibility; stage logic remains in stages/.
      - path: src/automation_business_scaffold/domains/tiktok/flows/monitor_tk_influencers/orchestrator.py
        reason: Required independent TK influencer monitoring workflow entrypoint; it owns product-video and creator-sync fan-out without importing another influencer workflow.
      - path: src/automation_business_scaffold/domains/tiktok/flows/refresh_current_competitor_table/stages/dispatch_product_collection.py
        reason: Stable workflow stage module for dispatch_product_collection; it owns row fan-out for the existing workflow stage rather than a generic helper abstraction.
      - path: src/automation_business_scaffold/domains/amazon/flows/refresh_amazon_product_row_by_asin/orchestrator.py
        reason: Required Amazon single-row workflow package entrypoint called only by the registered Runtime facade; it owns four-stage transitions and compact child payloads, while handlers retain all browser, Fact DB, object-storage, and Feishu side effects.
      - path: src/automation_business_scaffold/domains/amazon/flows/refresh_current_amazon_product_table/orchestrator.py
        reason: Required Amazon batch workflow entrypoint that selects 采集标签=T rows and creates idempotent amazon_product_row_refresh jobs under the same top-level request; it does not create child task requests or duplicate browser parsing, fact persistence, media sync, or Feishu projection.
      - path: src/automation_business_scaffold/domains/amazon/flows/amazon_product_row_refresh/orchestrator.py
        reason: Admitted Amazon row-level business job owner shared by batch row fan-out; it emits the primary browser_required wait signal, consumes the governed browser result, and delegates persistence through the existing amazon_product_row_persist handler contract.
      - path: src/automation_business_scaffold/domains/amazon/flows/amazon_product_row_persist/orchestrator.py
        reason: Required Amazon row persistence package entrypoint that serially composes existing media, fact persistence, projection, and Feishu handlers through dispatch boundaries, preserves media-partial retry semantics, and does not create a generic helper owner.
    responsibilities:
      - decide what business targets to collect
      - decide business filtering and row follow-up strategy
      - decide which projection mapper to use
      - own Amazon single-row stage transitions, child dispatch keys, and summary gating without directly executing handler side effects
      - decide whether a workflow enters fastmoss_security_browser_fallback and whether to retry the original FastMoss handler after browser resolution
    forbidden:
      - own durable fact persistence
      - own MinIO upload implementation
      - own Feishu low-level writing
      - create generic fact collection helper without contract

  fact_source_handler:
    paths:
      - src/automation_business_scaffold/capabilities/fact_sources/**
    responsibilities:
      - collect raw facts from TikTok/FastMoss or other external sources
      - return normalized raw result envelope
      - classify FastMoss MSG_SAFE_0001 as fallback_required with a redacted verification_request instead of generic fastmoss_http_failure
    forbidden:
      - decide Feishu business field projection
      - own workflow-level business filtering
      - duplicate FastMoss session/cookie recovery, login refresh, or external-login conflict policy

  browser_profile_health:
    paths:
      - src/automation_business_scaffold/infrastructure/browser/browser_bridge.py
    entrypoints:
      - ensure_browser_healthy
      - open_automation_page
    allowed_callers:
      - src/automation_business_scaffold/control_plane/executor/worker_dispatch.py
      - src/automation_business_scaffold/control_plane/supervisor/**
      - src/automation_business_scaffold/capabilities/browser/**
    responsibilities:
      - resolve one exact configured profile_ref and its provider through the existing browser bridge
      - run the bounded connect/new-page/about-blank/evaluate/close functional probe without mutating browser state before the verdict
      - execute at most one explicitly authorized exact-profile stop/start/reconnect recovery through a governed lifecycle command and public provider surface
      - close the probe-owned page, then detach or disconnect the probe session without closing the shared CDP browser
      - return sanitized phase evidence and classify missing detach support as cleanup failure
    forbidden:
      - decide Runtime retry, terminal status, cooldown, or workflow transitions
      - classify captcha, Security Check, HTTP status, parse failure, artifact failure, Fact DB failure, or Feishu failure as browser health failure
      - call private automation-framework methods or modify installed framework code
      - restart a profile other than the exact resolved profile_ref
      - call session.close on a shared CDP probe session
      - claim that the GCP VM is unreachable from VM-local evidence

  browser_execution_recovery:
    paths:
      - src/automation_business_scaffold/control_plane/supervisor/child_runner.py
      - src/automation_business_scaffold/control_plane/supervisor/execution_supervisor.py
      - src/automation_business_scaffold/control_plane/executor/worker_dispatch.py
      - src/automation_business_scaffold/control_plane/executor/looping.py
      - src/automation_business_scaffold/control_plane/executor/runner.py
      - src/automation_business_scaffold/control_plane/runtime_config/settings.py
      - src/automation_business_scaffold/control_plane/watchdog/scanner.py
      - src/automation_business_scaffold/domains/amazon/workflows/refresh_amazon_product_row_by_asin.py
      - src/automation_business_scaffold/domains/amazon/workflows/refresh_current_amazon_product_table.py
    responsibilities:
      - detect progress inactivity with monotonic time before Watchdog stale-progress intervention
      - preserve probe-before-kill, confirmed child exit, probe-after-kill, and probe-after-restart evidence in that order
      - own the single restart budget and terminal recovery errors for one child stall diagnosis
      - reserve recovery time separately from the browser handler wall-clock budget
      - persist only the compact browser diagnosis allowlist and refresh progress during diagnosis and recovery
      - keep Watchdog from terminalizing or killing a browser runloop whose quarantine-write-failed hold stage was persisted while the marker is retried
    forbidden:
      - interpret website DOM, captcha, HTTP status, product availability, or business fields
      - invoke provider-specific stop scripts from TikTok, Amazon, or FastMoss handlers
      - restart Chrome before the child process has exited
      - write a GCP VM failure without independent external-host evidence
      - introduce a parallel helper, service, manager, coordinator, collector, or orchestrator owner

  browser_operation_observability:
    paths:
      - src/automation_business_scaffold/infrastructure/browser/browser_bridge.py
      - src/automation_business_scaffold/capabilities/browser/tiktok_product_fetch_handler.py
      - src/automation_business_scaffold/capabilities/browser/tiktok/product_page.py
      - src/automation_business_scaffold/capabilities/browser/amazon_product_fetch_handler.py
      - src/automation_business_scaffold/domains/amazon/projections/runtime_result_projection.py
    responsibilities:
      - provide the shared started/terminal operation envelope from the existing browser bridge
      - emit started before each allowlisted blocking browser operation and completed or failed after it returns
      - emit suppressed_error when existing business logic intentionally suppresses an exception
      - throttle wait-loop samples and keep messages, details, error classes, and Runtime projection sanitized
      - preserve pre-page browser failure and browser diagnosis codes without requiring page-created artifact evidence
    forbidden:
      - call browser lifecycle stop or restart commands
      - emit cookie, authorization, header, HTML, DOM snapshot, full URL, raw exception message, or traceback
      - call Sync Playwright from a background logging thread
      - change the business result because progress logging failed

  browser_security_resolve:
    paths:
      - src/automation_business_scaffold/capabilities/browser/**
    responsibilities:
      - own browser_worker handlers that resolve provider security checks requiring a real browser
      - implement FastMoss security browser resolve behavior such as replaying the original failed FastMoss API request, solving the slider, and verifying MSG_SAFE_0001 is gone
      - return only redacted browser fallback evidence and cookie cache metadata
    forbidden:
      - decide keyword candidate filtering or max_candidates behavior
      - write Feishu business projections
      - store raw cookie values in handler summary, logs, or task result

  fastmoss_session_cookie_cache:
    paths:
      - src/automation_business_scaffold/infrastructure/fastmoss/**
      - src/automation_business_scaffold/infrastructure/runtime/**
    responsibilities:
      - own FastMoss cookie cache context, load/save semantics, and redacted cache status
      - own FastMoss platform session/cookie recovery, login refresh persistence, and external-login conflict classification
      - persist browser-exported FastMoss cookies into fastmoss_session_cookie_cache
      - expose cache metadata such as cookie_count, has_fd_tk, fd_tk_digest, and expires_at without exposing cookie values
    forbidden:
      - decide whether a workflow should enter fastmoss_security_browser_fallback
      - decide search business filters or Feishu writeback fields
      - treat cookies as an API token or log cookie values

  media_asset_sync:
    paths:
      - src/automation_business_scaffold/capabilities/media/**
    responsibilities:
      - download referenced media into process-local temporary files
      - upload/materialize only allowlisted long-term business media into MinIO
      - return complete bucket, object_key, and content_digest metadata
      - return fact_bundle.media_assets as a replacement set containing only verified materialized assets
      - resolve platform-owned media cache candidates through the existing Fact Store owner
      - validate cached object bytes and conditionally revalidate Amazon source media before reuse
    forbidden:
      - decide whether a product is business-worthy
      - decide Feishu writeback fields
      - upload runtime logs, HTML, page-data, network data, state dumps, ordinary screenshots, raw table snapshots, or temporary files
      - persist local_path as a durable media locator
      - merge pre-materialization source descriptions into persisted media assets
      - require or persist remote_uri as durable media state

  object_storage_transport:
    paths:
      - src/automation_business_scaffold/infrastructure/artifacts/**
      - src/automation_business_scaffold/infrastructure/runtime/repositories/artifact_object_repo.py
    responsibilities:
      - execute MinIO put, get, and stat operations requested by an admitted business-object writer
      - preserve the exact configured bucket and object key returned by the provider
      - expose stored byte metadata needed for digest verification
      - derive a URI from bucket and object_key only immediately before object access or external link generation
      - strip derived remote_uri before writing the Runtime artifact index
    allowed_logical_writers:
      - media_asset_sync
      - amazon_browser_capture
    forbidden:
      - classify a file as a long-term business object
      - scan Runtime results or referenced local files for automatic MinIO upload
      - infer a missing durable-reference bucket at read time
      - serialize or persist a derived remote_uri in database metadata or handler result envelopes
      - create a parallel helper, service, manager, coordinator, collector, or orchestrator owner

  mapper:
    paths:
      - src/automation_business_scaffold/domains/**/mappers/**
      - src/automation_business_scaffold/capabilities/**/mappers/**
    responsibilities:
      - map accepted raw payload into fact payload
    forbidden:
      - perform network fetch
      - perform MinIO upload
      - perform Feishu writeback

  fact_ingestion:
    paths:
      - src/automation_business_scaffold/capabilities/**/fact*
      - src/automation_business_scaffold/control_plane/**
      - src/automation_business_scaffold/infrastructure/facts/**
    responsibilities:
      - upsert fact entities, snapshots, relations, media assets, raw audit
      - persist media only from the final verified materialized replacement set
      - persist bucket, object_key, and content_digest without a derived remote_uri column
    forbidden:
      - decide business selection criteria
      - decide Feishu field projection
      - accept pre-materialization source descriptions as persisted media facts
      - copy remote_uri into a column or JSON metadata

  projection_mapper:
    paths:
      - src/automation_business_scaffold/domains/**/projections/**
    responsibilities:
      - map fact/business result to Feishu fields
    forbidden:
      - collect external facts
      - upload media
      - upsert Fact DB

  amazon_runtime_result_projection:
    paths:
      - src/automation_business_scaffold/domains/amazon/projections/runtime_result_projection.py
      - src/automation_business_scaffold/domains/amazon/projections/registry.py
    entrypoint:
      - src/automation_business_scaffold/contracts/handler/domain_mapping.py:get_runtime_result_projection
    allowed_callers:
      - src/automation_business_scaffold/control_plane/executor/worker_dispatch.py
      - src/automation_business_scaffold/contracts/handler/domain_mapping.py
    forbidden_callers:
      - src/automation_business_scaffold/capabilities/**
      - src/automation_business_scaffold/domains/**/flows/**
      - src/automation_business_scaffold/domains/**/jobs/**
      - src/automation_business_scaffold/domains/**/workflows/**
    responsibilities:
      - validate and project Amazon handler results into compact Runtime summary and result envelopes
      - enforce ASIN, media, capture evidence, writeback, observability, and Runtime response field allowlists
      - bind browser capture evidence to the claimed resource lane and return sanitized artifact index records
      - classify Amazon Runtime failures without mutating Runtime state
    forbidden:
      - access RuntimeStore or a database directly
      - persist a derived remote_uri in Runtime result or artifact metadata
      - execute browser, media, Fact DB, object storage, or Feishu side effects
      - claim jobs, advance workflow stages, or decide retry scheduling
      - create a parallel helper, service, manager, coordinator, collector, or orchestrator owner

  amazon_browser_capture:
    paths:
      - src/automation_business_scaffold/capabilities/browser/amazon/**
      - src/automation_business_scaffold/capabilities/browser/amazon_product_fetch_handler.py
    responsibilities:
      - normalize Amazon US ASIN identity and canonical URL for browser collection
      - visit one Amazon product page through the existing browser bridge
      - parse embedded data, same-origin page responses, semantic DOM, and controlled text blocks in precedence order
      - persist normalized capture for success and governed screenshot evidence for blocked or captcha outcomes
      - keep HTML, page-data, network data, ordinary screenshots, logs, and temporary files local
      - return compact complete bucket, object_key, and content_digest references without a serialized remote_uri
    forbidden:
      - write Fact DB
      - write Feishu business projections
      - materialize long-lived product media
      - bypass captcha, access blocks, or provider security policy
      - upload success HTML, page-data, network data, ordinary screenshots, logs, state dumps, or temporary files

  amazon_fact_persistence:
    paths:
      - alembic_fact.ini
      - alembic_fact/**
      - alembic/versions/20260714_0007_amazon_product_facts.py
      - scripts/execution_control/run_fact_alembic_upgrade.sh
      - src/automation_business_scaffold/infrastructure/schemas/amazon_fact_schema.py
      - src/automation_business_scaffold/infrastructure/facts/amazon_fact_store.py
      - src/automation_business_scaffold/capabilities/persistence/database/amazon_product_fact_upsert_handler.py
    responsibilities:
      - route Amazon Fact DDL through the explicit Fact migration database URL and isolated fact_alembic_version table
      - grant the configured shared Fact runtime role only schema usage, governed TikTok and Amazon Fact table DML, and Fact version reads; Runtime tables remain outside this role
      - define Amazon fact tables for migration and test bootstrap consumers
      - upsert Amazon products, snapshots, offers, variants, BSR, media relations, raw capture indexes, and Feishu bindings
      - query Amazon media cache candidates by normalized source URL digest without treating URL identity as freshness proof
      - persist and validate media from bucket, object_key, content_digest, positive size, and verified metadata without remote_uri
      - enforce marketplace plus ASIN identity and per-run idempotency keys
      - read normalized capture and media objects from MinIO by complete bucket, object_key, and content_digest references and verify actual stored bytes
    forbidden:
      - decide Feishu fields
      - visit or parse Amazon pages
      - decide workflow stage transitions
      - execute production DDL from daemon or worker paths
      - upload object storage content
      - read a local_path as fallback for a durable business object
      - persist or require remote_uri in Amazon Fact rows, JSON metadata, or cache validation

  rate_limit:
    paths:
      - src/automation_business_scaffold/infrastructure/rate_limit/**
      - src/automation_business_scaffold/infrastructure/*/**
    responsibilities:
      - own external API request pacing primitives and provider client integration
      - normalize configurable min/max randomized delay values
      - emit request pacing evidence without secrets
    forbidden:
      - decide business target selection
      - decide workflow stage transitions
      - encode provider business field mappings

legacy_reference_only: []
